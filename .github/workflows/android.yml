
name: Whatsapp Chat Converter

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: whatsapp-chat:ci
  GRADLE_VERSION: "9.5.0"
  ANDROID_PLATFORM: "37"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Whatsapp Chat Android Builder IMAGE
        uses: docker/build-push-action@v6
        with:
          context: .
          file: whatsapp-chat.Dockerfile
          load: true
          push: false
          tags: ${{ env.Image }}
          build-args:
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}
            ANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}
            BUILD_TOOLS=${{ env.BUILD_TOOLS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.Gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      
      - name: Lint, test, & build debug
        run: |
          mkdir -p ~/.gradle
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -v "$HOME/.gradle":/root/.gradle \
            ${{ env.IMAGE }} \
            gradle lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace
      
      - name: Upload Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      
      # Release Version
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK & AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            -v "$HOME/.gradle":/root/.gradle \
            -v "$RUNNER_TEMP/release.jks":/keystore/release.jks:ro \
            -e KEYSTORE_PATH=/keystore/release.jks \
            -e KEYSTORE_PASSWORD \
            -e KEY_ALIAS \
            -e KEY_PASSWORD \
            ${{ env.IMAGE }} \
            gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
